<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Выжить и не смыться</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  :root {
    --bg: #0f0f1a;
    --panel: #1e1e30;
    --panel-hover: #2a2a45;
    --border: #3a3a55;
    --text: #e8e8e8;
    --accent: #d4af37;
    --accent-dark: #2a2410;
    --scene-bg: #15152a;
    --shadow: #000;
    --frame: #1e1e30;
    --frame-inner: #0a0a14;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.8;
    padding: 30px 20px;
    max-width: 720px;
    margin: 0 auto;
    transition: background 0.3s ease, color 0.3s ease;
  }

  #menu, #characters, #achievements, #game {
    display: none;
    width: 100%;
  }
  #menu { display: block; }

  h1 {
    color: var(--accent);
    text-align: center;
    margin-bottom: 30px;
    font-size: 20px;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 var(--shadow);
    line-height: 1.6;
    transition: color 0.3s ease;
  }
  h2 {
    color: var(--accent);
    text-align: center;
    margin-bottom: 30px;
    font-size: 14px;
    text-shadow: 2px 2px 0 var(--shadow);
    transition: color 0.3s ease;
  }
  h3 {
    color: var(--accent);
    font-size: 11px;
    margin-bottom: 14px;
    margin-top: 20px;
    text-align: left;
    text-shadow: 1px 1px 0 var(--shadow);
    border-bottom: 2px solid var(--border);
    padding-bottom: 6px;
  }

  #toilet-showcase {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }

  #toilet-spinner {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 170px;
    perspective: 800px;
    margin-bottom: 12px;
  }

  .toilet-3d {
    width: 130px;
    height: 130px;
    animation: spin-toilet 6s linear infinite;
    transform-style: preserve-3d;
  }
  @keyframes spin-toilet {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }
  .toilet-3d svg {
    width: 100%;
    height: 100%;
    shape-rendering: crispEdges;
    image-rendering: pixelated;
  }

  #toilet-name {
    color: var(--accent);
    font-size: 9px;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-align: center;
    text-shadow: 2px 2px 0 var(--shadow);
    min-height: 14px;
    transition: color 0.3s ease;
  }

  .toilet-nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .toilet-nav button {
    width: 44px;
    height: 44px;
    padding: 0;
    margin: 0;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .toilet-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 30px;
  }
  .dot {
    width: 12px;
    height: 12px;
    background: var(--panel);
    border: 2px solid var(--border);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .dot:hover {
    border-color: var(--accent);
  }
  .dot.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  button {
    display: block;
    width: 100%;
    padding: 18px 16px;
    margin-bottom: 14px;
    font-size: 11px;
    font-family: 'Press Start 2P', monospace;
    background: var(--panel);
    color: var(--text);
    border: 3px solid var(--border);
    border-radius: 0;
    text-align: left;
    line-height: 1.6;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  button:hover {
    background: var(--panel-hover);
    border-color: var(--accent);
    color: var(--accent);
  }
  button:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--shadow);
  }
  button.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  button.disabled:hover {
    background: var(--panel);
    border-color: var(--border);
    color: var(--text);
  }

  #scene {
    background: var(--scene-bg);
    border: 3px solid var(--border);
    padding: 26px 22px;
    margin-bottom: 22px;
    min-height: 120px;
    font-size: 11px;
    line-height: 2;
    text-align: left;
    box-shadow: 4px 4px 0 var(--shadow);
    color: var(--text);
    white-space: pre-wrap;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }

  #scene::after {
    content: '▊';
    color: var(--accent);
    animation: blink 0.8s step-end infinite;
    margin-left: 2px;
  }
  #scene.done::after { content: ''; }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  #ending {
    color: var(--accent);
    font-size: 12px;
    margin-top: 20px;
    margin-bottom: 24px;
    text-align: center;
    text-shadow: 2px 2px 0 var(--shadow);
    line-height: 2;
    transition: color 0.3s ease;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 9px;
    color: #888;
  }
  .header-row span:hover { color: var(--accent); }

  .ach-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 30px;
  }
  .ach-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .ach-circle {
    width: 72px;
    height: 72px;
    background: var(--panel);
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #444;
    box-shadow: 3px 3px 0 var(--shadow);
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .ach-circle.unlocked {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dark);
  }
  .ach-label {
    font-size: 7px;
    text-align: center;
    color: #aaa;
    line-height: 1.6;
  }

  .ach-circle.legendary {
    width: 88px;
    height: 88px;
    font-size: 38px;
    border-color: #ff4f4f;
    color: #ff4f4f;
    background: #2a0808;
    box-shadow: 0 0 20px #ff4f4f, 4px 4px 0 var(--shadow);
    animation: legendary-pulse 2s infinite;
  }
  .ach-circle.legendary.unlocked {
    border-color: #ffd700;
    color: #ffd700;
    background: #2a1a00;
    box-shadow: 0 0 30px #ffd700, 0 0 60px #ff4f4f, 4px 4px 0 var(--shadow);
  }
  @keyframes legendary-pulse {
    0%, 100% { box-shadow: 0 0 20px #ff4f4f, 4px 4px 0 var(--shadow); }
    50% { box-shadow: 0 0 40px #ff4f4f, 4px 4px 0 var(--shadow); }
  }
  .legendary-wrapper {
    grid-column: 1 / -1;
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
  }
  .legendary-wrapper .ach-item {
    max-width: 140px;
  }
  .legendary-wrapper .ach-label {
    font-size: 8px;
    color: #ffd700;
    font-weight: bold;
  }

  .corner-btn {
    position: fixed;
    width: 56px;
    height: 56px;
    padding: 0;
    margin: 0;
    font-size: 22px;
    text-align: center;
    background: var(--panel);
    border: 3px solid var(--border);
    box-shadow: 4px 4px 0 var(--shadow);
    z-index: 50;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .corner-btn:hover {
    border-color: var(--accent);
    background: var(--panel-hover);
  }
  .corner-btn.off { opacity: 0.5; }

  #musicBtn { top: 20px; right: 20px; }
  #themeBtn { top: 20px; right: 90px; }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    border: 6px solid var(--frame);
    box-shadow: inset 0 0 0 3px var(--frame-inner);
    z-index: 1;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
</style>
</head>

<div id="achievements">

  var r = '';
  var pixels = [
    [0,0],[0,1],[1,1],[0,2],[1,2],[2,2],[0,3],[1,3],[2,3],[3,3],
    [0,4],[1,4],[2,4],[3,4],[4,4],[0,5],[1,5],[2,5],[3,5],[4,5],[5,5],

    [0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[1,9],[3,9],[5,9]
  ];
  pixels.forEach(function(p) {
    r += '<rect x="' + p[0] + '" y="' + p[1] + '" width="1" height="1" fill="%23' + c + '"/>';
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">' + r + '</svg>';

  outline.forEach(function(p) {

let typeCtx = null;

function playTypeSound() {
  try {
    if (!typeCtx) typeCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (typeCtx.state === 'suspended') typeCtx.resume();
    const osc = typeCtx.createOscillator();
    const gain = typeCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 900 + Math.random() * 200;
    gain.gain.setValueAtTime(0.015, typeCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, typeCtx.currentTime + 0.03);
    osc.connect(gain);
    gain.connect(typeCtx.destination);
    osc.start();
    osc.stop(typeCtx.currentTime + 0.03);
  } catch(e) {}
}

let musicCtx = null;
let musicPlaying = false;
let musicOscillators = [];
let musicLoopInterval = null;

function toggleMusic() {
  const btn = document.getElementById('musicBtn');
  if (!musicPlaying) {
    startMusic();
    btn.classList.remove('off');
    btn.textContent = '🎵';
    musicPlaying = true;
  } else {
    stopMusic();
    btn.classList.add('off');
    btn.textContent = '🔇';
    musicPlaying = false;
  }
}

function startMusic() {
  if (!musicCtx) musicCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (musicCtx.state === 'suspended') musicCtx.resume();

  const notes = [
    { f: 261.63, d: 0.2 }, { f: 329.63, d: 0.2 }, { f: 392.00, d: 0.2 },
    { f: 523.25, d: 0.4 }, { f: 392.00, d: 0.2 }, { f: 329.63, d: 0.2 },
    { f: 261.63, d: 0.4 }, { f: 293.66, d: 0.2 }, { f: 349.23, d: 0.2 },
    { f: 440.00, d: 0.4 }, { f: 349.23, d: 0.2 }, { f: 293.66, d: 0.2 },
    { f: 261.63, d: 0.6 }
  ];
  const tempo = 1.6;

  function scheduleLoop() {
    if (!musicCtx) return;
    let time = musicCtx.currentTime + 0.05;
    notes.forEach(function(n) {
      const osc = musicCtx.createOscillator();
      const gain = musicCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0.035, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + n.d * tempo * 0.9);
      osc.connect(gain);
      gain.connect(musicCtx.destination);
      osc.start(time);
      osc.stop(time + n.d * tempo);
      musicOscillators.push(osc);
      time += n.d * tempo;
    });
  }

  scheduleLoop();
  const totalDur = notes.reduce(function(s, n) { return s + n.d * tempo; }, 0) * 1000;
  musicLoopInterval = setInterval(function() {
    if (musicPlaying && musicCtx) scheduleLoop();
  }, totalDur);
}

function stopMusic() {
  musicOscillators.forEach(function(osc) {
    try { osc.stop(); } catch(e) {}
  });
  musicOscillators = [];
  if (musicLoopInterval) {
    clearInterval(musicLoopInterval);
    musicLoopInterval = null;
  }
  if (musicCtx) {
    musicCtx.close();
    musicCtx = null;
  }
}

let musicAutoStarted = false;

function tryAutoStartMusic() {
  if (musicAutoStarted) return;
  musicAutoStarted = true;
  startMusic();
  musicPlaying = true;
  const btn = document.getElementById('musicBtn');
  if (btn) {
    btn.classList.remove('off');
    btn.textContent = '🎵';
  }
}

      container.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'ach-grid';
      group.items.forEach(function(a) {
        var unlocked = unlockedAchievements.indexOf(a.id) !== -1;
        var item = document.createElement('div');
        item.className = 'ach-item';
        item.innerHTML =
          '<div class="ach-circle ' + (unlocked ? 'unlocked' : '') + '">' + a.icon + '</div>' +
          '<div class="ach-label">' + a.label + '</div>';
        grid.appendChild(item);
      });
      container.appendChild(grid);
    }
  });
}

function unlockAchievement(id) {
  if (unlockedAchievements.indexOf(id) === -1) {
    unlockedAchievements.push(id);
    localStorage.setItem('tt_ach', JSON.stringify(unlockedAchievements));
    checkLegendary();
  }
}

  document.getElementById('game').style.display = 'none';
  document.getElementById(name).style.display = 'block';

}

/* ============================================================
   ЛОГИКА ИГРЫ
   ============================================================ */
let typeTimer = null;
let currentFullText = '';
let currentCallback = null;
let isTyping = false;
let currentStory = null;

const charLabels = {
  visitor: 'ПОСЕТИТЕЛЬ',
  visitor_f: 'ПОСЕТИТЕЛЬНИЦА',
  glam: 'ГЛАМУРНАЯ ФИФА'
};

function startGame(charId) {
  if (charId === 'visitor') {
    currentStory = storyVisitor;
  } else if (charId === 'visitor_f') {
    currentStory = storyVisitorF;
  } else if (charId === 'glam') {
    currentStory = storyGlam;
  } else {
    return;
  }
  document.getElementById('char-label').textContent = charLabels[charId];
  showMenu('game');
  showNode('start');
}

function typeText(el, text, callback) {
  if (typeTimer) clearInterval(typeTimer);
  el.textContent = '';
  el.classList.remove('done');
  currentFullText = text;
  currentCallback = callback;
  isTyping = true;
  let i = 0;
  const speed = 25;
  typeTimer = setInterval(function() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      if (text.charAt(i) !== ' ') playTypeSound();
      i++;
    } else {
      clearInterval(typeTimer);
      typeTimer = null;
      isTyping = false;
      el.classList.add('done');
      if (callback) {
        const cb = callback;
        currentCallback = null;
        cb();
      }
    }
  }, speed);
}

function finishTyping() {
  if (!isTyping) return;
  const el = document.getElementById('scene');
  if (typeTimer) clearInterval(typeTimer);
  typeTimer = null;
  isTyping = false;
  el.textContent = currentFullText;
  el.classList.add('done');
  if (currentCallback) {
    const cb = currentCallback;
    currentCallback = null;
    cb();
  }
}

function showNode(key) {
  const node = currentStory[key];
  if (!node) return;
  if (node.achievement) unlockAchievement(node.achievement);
  const sceneEl = document.getElementById('scene');
  const endingEl = document.getElementById('ending');
  const choicesEl = document.getElementById('choices');
  const toMenuBtn = document.getElementById('to-menu-btn');
  endingEl.textContent = '';
  choicesEl.innerHTML = '';
  toMenuBtn.style.display = 'none';
  typeText(sceneEl, node.text, function() {
    if (node.ending) {
      endingEl.textContent = node.ending;
      toMenuBtn.style.display = 'block';
      return;
    }
    if (node.next) {
      const btn = document.createElement('button');
      btn.textContent = '► ПРОДОЛЖИТЬ';
      btn.onclick = function() { showNode(node.next); };
      choicesEl.appendChild(btn);
      return;
    }
    node.choices.forEach(function(choice) {
      const btn = document.createElement('button');
      btn.textContent = choice.text;
      btn.onclick = function() { showNode(choice.next); };
      choicesEl.appendChild(btn);
    });
  });
}

document.addEventListener('click', function(e) {
  if (!isTyping) return;
  if (e.target.closest('button')) return;
  finishTyping();
}, true);

/* ============================================================
   СТАРТ
   ============================================================ */
applyTheme(currentTheme);
showToilet(0);
renderAchievements();
